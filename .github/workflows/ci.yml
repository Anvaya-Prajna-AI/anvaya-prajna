name: CI Pipeline

on:
  push:
    branches: [main, master, 1default, '*ver_*']
  pull_request:
    branches: [main, master, 1default, '*ver_*']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-build-test:
    name: Backend Build & Test (Java 21)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build & Run Tests with JaCoCo
        run: ./gradlew check codeCoverageReport --no-daemon

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-test-results
          path: '**/build/test-results/**/*.xml'
          retention-days: 7

      - name: Upload JaCoCo Coverage Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-coverage-report
          path: 'build/reports/jacoco/'
          retention-days: 7

  frontend-build-test:
    name: Frontend Build & Test (Node 20)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/explanation-player
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: packages/explanation-player/package.json

      - name: Install NPM Dependencies
        run: npm ci || npm install

      - name: Run Linter
        run: npm run lint

      - name: Run Vitest Unit Tests
        run: npm run test

      - name: Build Package & Distribution
        run: npm run build && npm run build:lib

  docker-verify:
    name: Docker Build Verification
    runs-on: ubuntu-latest
    needs: [backend-build-test, frontend-build-test]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration
        run: docker compose config -q

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Explain Service Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: anvaya-prajna/explain-service:test

      - name: Build Explain Player Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./packages/explanation-player
          file: ./packages/explanation-player/Dockerfile
          push: false
          tags: anvaya-prajna/explain-player:test
