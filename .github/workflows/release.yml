name: Release Pipeline

on:
  push:
    branches:
      - 'main'
      - 'default'
      - '*ver_[0-9]+.[0-9]+.[0-9]+*'
      - '**ver_*'
      - '*ver_*'
      - '**/ver_*'
    tags:
      - 'v*'
      - 'ver_*'
  pull_request:
    branches:
      - 'main'
      - 'default'
      - '*ver_[0-9]+.[0-9]+.[0-9]+*'
      - '**ver_*'
      - '*ver_*'
      - '**/ver_*'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  publish-libraries:
    name: Publish Java Libraries (Maven / GH Packages)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Publish Libraries to GitHub Packages & Maven Central
        if: github.event_name != 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          OSSRH_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          OSSRH_TOKEN: ${{ secrets.OSSRH_TOKEN }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_KEY_ID: ${{ secrets.SIGNING_KEY_ID }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: ./gradlew publish --no-daemon

      - name: Dry Run Build & Jar Verification for PRs
        if: github.event_name == 'pull_request'
        run: ./gradlew assemble check --no-daemon

  publish-frontend:
    name: Publish Frontend Package (@anvaya-prajna/explanation-player)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/explanation-player
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://npm.pkg.github.com'
          scope: '@anvaya-prajna'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Build Library Bundle
        run: npm run build:lib

      - name: Publish Package to GitHub NPM Registry
        if: github.event_name != 'pull_request'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm publish --access public

  publish-docker:
    name: Build & Push Docker Images (GHCR)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Extract Release Version
        id: get_version
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            RAW_TAG="${GITHUB_REF#refs/tags/}"
            VERSION="${RAW_TAG#v}"
            VERSION="${VERSION#ver_}"
          elif [[ "${{ github.ref_name }}" =~ ver_([0-9]+\.[0-9]+\.[0-9]+.*) ]]; then
            VERSION="${BASH_REMATCH[1]}"
          elif [[ "${{ github.ref_name }}" == "main" || "${{ github.ref_name }}" == "default" ]]; then
            VERSION="latest"
          else
            VERSION="${{ github.ref_name }}"
          fi
          echo "Extracted Version: $VERSION"
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push explain-service Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/explain-service:latest
            ghcr.io/${{ github.repository_owner }}/explain-service:${{ steps.get_version.outputs.VERSION }}

      - name: Build and Push explain-player Image
        uses: docker/build-push-action@v5
        with:
          context: ./packages/explanation-player
          file: ./packages/explanation-player/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/explain-player:latest
            ghcr.io/${{ github.repository_owner }}/explain-player:${{ steps.get_version.outputs.VERSION }}

  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    needs: [publish-libraries, publish-frontend, publish-docker]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract Tag / Release Version
        id: release_meta
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
          elif [[ "${{ github.ref_name }}" =~ ver_([0-9]+\.[0-9]+\.[0-9]+.*) ]]; then
            TAG_NAME="v${BASH_REMATCH[1]}"
          elif [[ "${{ github.ref_name }}" == "main" || "${{ github.ref_name }}" == "default" ]]; then
            TAG_NAME="v$(date +'%Y.%m.%d-%H%M%S')"
          else
            TAG_NAME="v-${{ github.ref_name }}"
          fi
          echo "TAG_NAME=${TAG_NAME}" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_meta.outputs.TAG_NAME }}
          name: Release ${{ steps.release_meta.outputs.TAG_NAME }}
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
