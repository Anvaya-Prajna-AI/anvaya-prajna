name: Release Pipeline

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  publish-libraries:
    name: Publish Java Libraries (Maven / GH Packages)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Publish Libraries to GitHub Packages & Maven Central
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          OSSRH_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          OSSRH_TOKEN: ${{ secrets.OSSRH_TOKEN }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_KEY_ID: ${{ secrets.SIGNING_KEY_ID }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: ./gradlew publish --no-daemon

  publish-frontend:
    name: Publish Frontend Package (@anvaya-prajna/explanation-player)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/explanation-player
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://npm.pkg.github.com'
          scope: '@anvaya-prajna'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Build Library Bundle
        run: npm run build:lib

      - name: Publish Package to GitHub NPM Registry
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm publish --access public

  publish-docker:
    name: Build & Push Docker Images (GHCR)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Extract Tag Version
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push explain-service Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/explain-service:latest
            ghcr.io/${{ github.repository_owner }}/explain-service:${{ steps.get_version.outputs.VERSION }}

      - name: Build and Push explain-player Image
        uses: docker/build-push-action@v5
        with:
          context: ./packages/explanation-player
          file: ./packages/explanation-player/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/explain-player:latest
            ghcr.io/${{ github.repository_owner }}/explain-player:${{ steps.get_version.outputs.VERSION }}

  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [publish-libraries, publish-frontend, publish-docker]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
