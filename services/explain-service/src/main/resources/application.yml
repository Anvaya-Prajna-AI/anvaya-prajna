server:
  port: 8080

spring:
  application:
    name: explain-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:anvayadb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${SPRING_REDIS_PORT:6379}
      password: ${SPRING_REDIS_PASSWORD:anvaya_redis_secret}
      timeout: 2000ms

  ai:
    openai:
      base-url: ${SPRING_AI_OPENAI_BASE_URL:http://localhost:4000}
      api-key: ${SPRING_AI_OPENAI_API_KEY:${OPENAI_API_KEY:sk-litellm-master-key}}
      chat:
        options:
          model: ${OPENAI_MODEL:gpt-4o-mini}
          temperature: 0.2

# OpenAPI & Swagger UI Configuration
springdoc:
  api-docs:
    path: /api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

# Resilience4j Rate Limiting
resilience4j:
  ratelimiter:
    instances:
      explanationGeneration:
        limitForPeriod: 50
        limitRefreshPeriod: 1s
        timeoutDuration: 50ms

# Observability, Tracing & Metrics
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
    prometheus:
      enabled: true
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}

logging:
  level:
    root: INFO
    ai.anvaya.prajna: DEBUG
