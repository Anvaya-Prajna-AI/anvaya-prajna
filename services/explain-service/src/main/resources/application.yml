server:
  port: 8080

spring:
  application:
    name: explain-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:anvayadb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true

  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${SPRING_REDIS_PORT:6379}
      timeout: 2000ms

  ai:
    openai:
      base-url: ${SPRING_AI_OPENAI_BASE_URL:http://localhost:4000}
      api-key: ${SPRING_AI_OPENAI_API_KEY:${OPENAI_API_KEY:sk-litellm-master-key}}
      chat:
        options:
          model: ${OPENAI_MODEL:gpt-4o-mini}
          temperature: 0.2

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO
    ai.anvaya.prajna: DEBUG
