plugins {
    id 'java'
    alias(libs.plugins.spring.boot)
    alias(libs.plugins.spring.dependency.management)
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.ai:spring-ai-bom:${libs.versions.spring.ai.get()}"
    }
}

dependencies {
    // Core Reasoning Engine Library (ASI03 decoupled)
    implementation project(':libraries:explain-core')

    // Spring Boot Starters for Reference REST Service
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'

    // Database & Migrations
    runtimeOnly libs.postgres.driver
    runtimeOnly 'com.h2database:h2'
    implementation libs.flyway.core
    implementation libs.flyway.postgres

    // OpenTelemetry, Metrics & Structured Logging
    implementation 'io.micrometer:micrometer-tracing-bridge-otel'
    implementation libs.otel.exporter.otlp
    implementation libs.micrometer.prometheus
    implementation libs.logstash.logback

    // Rate Limiting & Resilience
    implementation libs.resilience4j.ratelimiter
    implementation libs.resilience4j.spring.boot

    // OpenAPI & Swagger Documentation
    implementation libs.springdoc.openapi

    // Lombok
    compileOnly libs.lombok
    annotationProcessor libs.lombok

    testCompileOnly libs.lombok
    testAnnotationProcessor libs.lombok

    // Testing
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation libs.testcontainers.postgresql
    testImplementation libs.testcontainers.junit
    testImplementation libs.junit.jupiter
    testImplementation libs.assertj.core
}
