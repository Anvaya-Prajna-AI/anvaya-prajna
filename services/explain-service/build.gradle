plugins {
    id 'java'
    alias(libs.plugins.spring.boot)
    alias(libs.plugins.spring.dependency.management)
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.ai:spring-ai-bom:${libs.versions.spring.ai.get()}"
    }
}

dependencies {
    implementation project(':libraries:explanation-ir')
    implementation project(':libraries:math-core')
    implementation project(':libraries:reasoning-core')
    implementation project(':libraries:validation-core')

    // Spring Boot Starters
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // Spring AI
    implementation libs.spring.ai.openai

    // Database & Migrations
    runtimeOnly libs.postgres.driver
    runtimeOnly 'com.h2database:h2'
    implementation libs.flyway.core
    implementation libs.flyway.postgres

    // OpenTelemetry
    implementation libs.otel.api
    implementation libs.otel.sdk
    implementation 'io.micrometer:micrometer-tracing-bridge-otel'

    // Lombok
    compileOnly libs.lombok
    annotationProcessor libs.lombok

    testCompileOnly libs.lombok
    testAnnotationProcessor libs.lombok

    // Testing
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation libs.testcontainers.postgresql
    testImplementation libs.testcontainers.junit
}
