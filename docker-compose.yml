services:
  # ============================================================
  # PostgreSQL 16 Database
  # ============================================================
  postgres:
    image: postgres:16-alpine
    container_name: anvaya-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-anvayadb}
      POSTGRES_USER: ${POSTGRES_USER:-anvaya}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-anvaya_secret}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-anvaya} -d ${POSTGRES_DB:-anvayadb}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - anvaya-net

  # ============================================================
  # Redis 7 Cache & Session Store (Secured with AUTH)
  # ============================================================
  redis:
    image: redis:7-alpine
    container_name: anvaya-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-anvaya_redis_secret}"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-anvaya_redis_secret}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - anvaya-net

  # ============================================================
  # LiteLLM Proxy (Unified AI Gateway & Router)
  # ============================================================
  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: anvaya-litellm
    restart: unless-stopped
    ports:
      - "${LITELLM_PORT:-4000}:4000"
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-litellm-master-key}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_REGION_NAME: ${AWS_REGION_NAME:-us-east-1}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
    volumes:
      - ./litellm-config.yaml:/app/config.yaml
    command: ["--config", "/app/config.yaml", "--port", "4000", "--num_workers", "2"]
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - anvaya-net

  # ============================================================
  # Jaeger Distributed Tracing (OTLP Receiver + UI)
  # ============================================================
  jaeger:
    image: jaegertracing/all-in-one:1.60
    container_name: anvaya-jaeger
    restart: unless-stopped
    ports:
      - "16686:16686" # Web UI
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    networks:
      - anvaya-net

  # ============================================================
  # Prometheus Metrics Collector
  # ============================================================
  prometheus:
    image: prom/prometheus:v2.54.0
    container_name: anvaya-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - anvaya-net

  # ============================================================
  # Grafana Metrics & Tracing Dashboard
  # ============================================================
  grafana:
    image: grafana/grafana:11.2.0
    container_name: anvaya-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
    networks:
      - anvaya-net

  # ============================================================
  # Anvaya Prajna Explain Service (Spring Boot 3 Backend)
  # ============================================================
  explain-service:
    build:
      context: .
      dockerfile: Dockerfile
    image: anvaya-prajna/explain-service:latest
    container_name: anvaya-explain-service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      litellm:
        condition: service_started
      jaeger:
        condition: service_started
    environment:
      # Database Connection
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-anvayadb}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-anvaya}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-anvaya_secret}
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver

      # JPA & Flyway
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_FLYWAY_ENABLED: "true"
      SPRING_FLYWAY_BASELINE_ON_MIGRATE: "true"

      # Redis Cache
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:-anvaya_redis_secret}

      # Observability & Tracing
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318/v1/traces

      # AI Provider (LiteLLM Proxy -> Bedrock Nova / Gemini / OpenAI / Ollama)
      SPRING_AI_OPENAI_BASE_URL: ${LITELLM_BASE_URL:-http://litellm:4000}
      SPRING_AI_OPENAI_API_KEY: ${LITELLM_MASTER_KEY:-sk-litellm-master-key}
      SPRING_AI_OPENAI_CHAT_OPTIONS_MODEL: ${DEFAULT_MODEL:-gpt-4o-mini}

      # JVM / Logging
      JAVA_TOOL_OPTIONS: "-Xms256m -Xmx768m"
      LOGGING_LEVEL_AI_ANVAYA_PRAJNA: DEBUG
    ports:
      - "${APP_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 25s
    networks:
      - anvaya-net

  # ============================================================
  # Anvaya Prajna Explain Player UI (React / Vite Frontend)
  # ============================================================
  explain-player:
    build:
      context: ./packages/explanation-player
      dockerfile: Dockerfile
    image: anvaya-prajna/explain-player:latest
    container_name: anvaya-explain-player
    restart: unless-stopped
    depends_on:
      explain-service:
        condition: service_started
    ports:
      - "${PLAYER_PORT:-3000}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - anvaya-net

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  anvaya-net:
    driver: bridge
